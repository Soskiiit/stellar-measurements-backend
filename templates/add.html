<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#643918">
    <title>{{ if .hasDraft }}Публикация: {{ .star.Name }}{{ else }}Новая звезда{{ end }} — Звёздные измерения</title>
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="/static/styles/add.css">
</head>
<body class="add-page">
    <header class="header">
        <a href="/" class="header-logo">⭗ StarParallax</a>
    </header>

    <div class="add-container">
        {{ if .hasDraft }}
        <!-- Шаг 2: У пользователя есть черновик. Заполнение описания и полей по теме для публикации -->
        <div class="add-header-row">
            <h1 class="add-header">Публикация черновика</h1>
        </div>

        <form action="/stars/publish" method="POST">
            <input type="hidden" name="star_id" value="{{ .star.ID }}">

            <div class="add-section">
                <h2 class="add-section-title">Медиа</h2>
                <div class="add-media-stack">
                    <div class="add-media-strip">
                        <img src="/static/img/video.png" alt="Видео" class="add-media-icon">
                        <span class="add-media-label">Видео звезды</span>
                    </div>
                    <div class="add-media-strip">
                        <img src="/static/img/image.png" alt="Фото" class="add-media-icon">
                        <span class="add-media-label">Фото звезды</span>
                    </div>
                </div>
            </div>

            <div class="add-section">
                <h2 class="add-section-title">О звезде</h2>

                <div class="add-field">
                    <label class="add-label">Название звезды</label>
                    <input type="text" name="name" class="add-input" value="{{ .star.Name }}" readonly>
                </div>

                <div class="add-field">
                    <label class="add-label">Краткое описание</label>
                    <textarea name="description" class="add-textarea" placeholder="Краткое описание звезды, спектральный класс, созвездие..." required>{{ .star.Description }}</textarea>
                </div>

                <div class="add-field">
                    <label class="add-label">Годичный параллакс, мас</label>
                    <input type="number" step="0.0001" name="parallax" class="add-input" placeholder="0.379" value="{{ if gt .star.Parallax 0.0 }}{{ .star.Parallax }}{{ end }}" required>
                </div>

                <div class="add-field">
                    <label class="add-label">Расстояние, пк</label>
                    <input type="number" step="0.01" name="distance" class="add-input" placeholder="2.64" value="{{ if gt .star.Distance 0.0 }}{{ .star.Distance }}{{ end }}" required>
                </div>

                <button type="submit" class="add-submit-btn">Опубликовать</button>
            </div>
        </form>

        {{ else }}
        <!-- Шаг 1: Черновика нет. Создание услуги (указывается название, фото, видео) и кнопка Далее -->
        <div class="add-header-row">
            <h1 class="add-header">Новая звезда</h1>
        </div>

        <form action="/stars" method="POST">
            <div class="add-section">
                <h2 class="add-section-title">Медиа</h2>
                <div class="add-media-stack">
                    <label class="add-media-strip" for="star-video">
                        <img src="/static/img/video.png" alt="Видео" class="add-media-icon">
                        <span class="add-media-label">Видео звезды</span>
                        <input type="file" id="star-video" name="video" accept="video/*" hidden>
                    </label>
                    <label class="add-media-strip" for="star-image">
                        <img src="/static/img/image.png" alt="Фото" class="add-media-icon">
                        <span class="add-media-label">Фото звезды</span>
                        <input type="file" id="star-image" name="image" accept="image/*" hidden>
                    </label>
                </div>
            </div>

            <div class="add-section">
                <h2 class="add-section-title">О звезде</h2>

                <div class="add-field">
                    <label class="add-label">Название звезды</label>
                    <input type="text" name="name" class="add-input" placeholder="Например: Сириус" required>
                </div>

                <button type="submit" class="add-submit-btn">Далее</button>
            </div>
        </form>
        {{ end }}
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <img src="/static/img/feed.png" alt="Лента" class="nav-icon">
            <span>Лента</span>
        </a>
        <a href="/add" class="nav-item active">
            <img src="/static/img/add.png" alt="Добавить" class="nav-icon">
            <span>Добавить</span>
        </a>
        <a href="/catalog" class="nav-item">
            <img src="/static/img/menu.png" alt="Каталог" class="nav-icon">
            <span>Каталог</span>
        </a>
    </nav>
</body>
</html>
