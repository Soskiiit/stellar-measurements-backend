<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#643918">
    <title>Плитка — Звёздные измерения</title>
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="/static/styles/gallery.css">
</head>
<body class="tile-page">
    <header class="header">
        <a href="/" class="header-logo">⭗ StarParallax</a>
    </header>

    <div class="tile-container">
        <h1 class="tile-header">Каталог звёзд</h1>

        <form action="/catalog" method="GET" class="tile-filter-form">
            <div class="tile-filter-slider">
                <label class="tile-filter-label" for="distance-range">Расстояние до, пк</label>
                <div class="tile-slider-track">
                    <input type="range" id="distance-range" name="distance"
                           min="0" max="1000" step="1"
                           value="{{ if .distance }}{{ .distance }}{{ else }}1000{{ end }}"
                           class="tile-range-input">
                    <div class="tile-slider-ticks">
                        <span>0</span>
                        <span>1000</span>
                    </div>
                </div>

            </div>
            <button type="submit" class="tile-filter-btn">Поиск</button>
        </form>

        <div class="tile-grid">
            {{ range .stars }}
            <div class="tile-card-wrapper">
                <a href="/feed/{{ .ID }}" class="tile-card">
                    <div class="tile-card-image">
                        <img src="{{ .ImageURL }}" alt="{{ .Name }}" onerror="this.onerror=null;this.src='/static/img/star_default_404.jpg';">
                    </div>
                    <div class="tile-card-info">
                        <div class="tile-card-details">
                            <span class="tile-card-name" title="{{ .Name }}">{{ .Name }}</span>
                            <span class="tile-card-meta">D = {{ printf "%.2f" .Distance }} пк</span>
                        </div>
                        <span class="tile-card-likes">
                            <span class="tile-card-like-icon">&#9825;</span>
                            {{ len .Likes }}
                        </span>
                    </div>
                </a>
                <form action="/stars/delete" method="POST" class="tile-delete-form">
                    <input type="hidden" name="star_id" value="{{ .ID }}">
                    <button type="submit" class="tile-delete-btn" title="Удалить услугу">✕</button>
                </form>
            </div>
            {{ end }}
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <img src="/static/img/feed.png" alt="Лента" class="nav-icon">
            <span>Лента</span>
        </a>
        <a href="/add" class="nav-item">
            <img src="/static/img/add.png" alt="Добавить" class="nav-icon">
            <span>Добавить</span>
        </a>
        <a href="/catalog" class="nav-item active">
            <img src="/static/img/menu.png" alt="Каталог" class="nav-icon">
            <span>Каталог</span>
        </a>
    </nav>

</body>
</html>
